name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  specs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crystal: ["1.21.1", "1.22.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Install reference Bundler
        run: gem install bundler -v 4.0.24
      - name: Expose bridge env
        run: |
          echo "CELERITE_BRIDGE_SERVER=${{ github.workspace }}/assets/bridge/server.rb" >> "$GITHUB_ENV"
          echo "CELERITE_REFERENCE_BUNDLER_LIB=$(gem contents bundler -v 4.0.24 --show-install-dir)/lib" >> "$GITHUB_ENV"
          echo "CELERITE_PROFILE_BUNDLER_VERSION=4.0.24" >> "$GITHUB_ENV"
      - run: shards build
      - run: crystal spec
      - run: crystal tool format --check src spec

  differential:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bundler_ref: ["4.0.24", "2.7.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "latest"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Install reference Bundler
        run: gem install bundler -v ${{ matrix.bundler_ref }}
      - name: Build
        run: shards build
      - name: Differential (${{ matrix.bundler_ref }})
        env:
          BUNDLER_REF_VERSION: ${{ matrix.bundler_ref }}
        run: script/differential

  upstream-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "latest"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Install reference Bundler + rspec
        run: gem install bundler:4.0.24 rspec
      - name: Build
        run: shards build
      - name: Upstream lockfile spec family
        run: script/upstream-specs
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-spec-report
          path: docs/compat-matrix/generated/upstream-lockfile-*.md

  gem-package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "latest"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Build platform gem (includes install smoke)
        run: script/gem
      - uses: actions/upload-artifact@v4
        with:
          name: celerite-gem-${{ matrix.os }}
          path: pkg/*.gem
          if-no-files-found: error
