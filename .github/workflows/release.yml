name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "latest"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      # Each OS carries a platform-scoped checksums file so the artifacts can
      # be merged without clobbering each other (publish reassembles the
      # single checksums.sha256 install.sh verifies against).
      - name: Build release artifacts (binary + bundle + installers + gem)
        run: |
          script/release
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$os" in mingw* | msys* | cygwin*) os="windows" ;; esac
          mv dist/checksums.sha256 "dist/checksums-$os-$(uname -m).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: |
            dist/*
            pkg/*.gem
          if-no-files-found: error

  rubygems:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: assets
      # OIDC trusted publishing: no long-lived API key is stored in the repo.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Publish platform gems
        env:
          # Start with the platform-family that is packaged self-contained
          # today. Set the CELERITE_PUSH_PLATFORM_GLOB repository variable to
          # `*` after Linux/Windows dynamic-library bundling has been verified.
          CELERITE_PUSH_PLATFORM_GLOB: ${{ vars.CELERITE_PUSH_PLATFORM_GLOB || '*-darwin' }}
        run: script/push-gems assets "$CELERITE_PUSH_PLATFORM_GLOB"

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: assets
      - name: Merge per-platform checksums
        run: |
          cd assets
          if ls checksums-*.sha256 >/dev/null 2>&1; then
            cat checksums-*.sha256 | sort -u > checksums.sha256
            rm -f checksums-*.sha256
          fi
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: script/publish assets
